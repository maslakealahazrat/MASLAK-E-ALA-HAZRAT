name: Import Quran Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-quran:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase
        run: npm install @supabase/supabase-js

      - name: Import Quran
        env:
          SUPABASE_URL: https://yzzgyqdbekjdtkefyptx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          import { readFileSync } from 'node:fs';

          if (!process.env.SUPABASE_SERVICE_ROLE_KEY) {
            throw new Error('SUPABASE_SERVICE_ROLE_KEY secret missing');
          }

          const db = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { auth: { persistSession: false } }
          );

          const read = path =>
            readFileSync(path, 'utf8').replace(/^\uFEFF/, '');

          function attrs(s) {
            return Object.fromEntries(
              [...s.matchAll(/([\w]+)="([^"]*)"/g)]
                .map(m => [m[1], m[2]])
            );
          }

          const xml = read('data/quran/quran-data.xml');
          const surahs = [...xml.matchAll(/<sura\b[^>]*\/>/g)]
            .map(m => {
              const a = attrs(m[0]);
              return {
                surah_number: Number(a.index),
                name_english: a.ename,
                name_arabic: a.name,
                ayah_count: Number(a.ayas),
                revelation_type:
                  a.type?.toLowerCase().startsWith('med') ?
                  'Madani' : 'Makki'
              };
            });

          if (
            surahs.length !== 114 ||
            surahs.some((s, i) =>
              s.surah_number !== i + 1 ||
              !s.name_arabic ||
              !s.name_english ||
              !s.ayah_count
            )
          ) {
            throw new Error('Surah XML validation failed');
          }

          const expectedAyahs =
            surahs.reduce((n, s) => n + s.ayah_count, 0);

          if (expectedAyahs !== 6236) {
            throw new Error(`Unexpected ayah total: ${expectedAyahs}`);
          }

          function readVerses(path) {
            const lines = read(path)
              .split(/\r?\n/)
              .map(s => s.trim())
              .filter(Boolean);

            const parsed = lines.map(line => {
              const p = line.split('|');

              if (
                p.length >= 3 &&
                /^\d+$/.test(p[0]) &&
                /^\d+$/.test(p[1])
              ) {
                return {
                  surah_number: Number(p[0]),
                  ayah_number: Number(p[1]),
                  text: p.slice(2).join('|').trim()
                };
              }

              return null;
            });

            if (parsed.every(Boolean)) {
              return parsed;
            }

            if (lines.length !== expectedAyahs) {
              throw new Error(
                `${path}: expected ${expectedAyahs} lines, got ${lines.length}. Import stopped.`
              );
            }

            const verses = [];
            let pos = 0;

            for (const s of surahs) {
              for (let a = 1; a <= s.ayah_count; a++) {
                verses.push({
                  surah_number: s.surah_number,
                  ayah_number: a,
                  text: lines[pos++]
                });
              }
            }

            return verses;
          }

          const arabic = readVerses('data/quran/quran-uthmani.txt');
          const urdu = readVerses('data/translations/ur.kanzuliman.txt');
          const english = readVerses('data/translations/en.ahmedraza.txt');

          function validate(rows, label) {
            const refs = new Set(
              rows.map(r => `${r.surah_number}:${r.ayah_number}`)
            );

            if (
              rows.length !== 6236 ||
              refs.size !== 6236 ||
              rows.some(r => !r.text)
            ) {
              throw new Error(`${label} verse validation failed`);
            }

            for (const s of surahs) {
              const count = rows.filter(
                r => r.surah_number === s.surah_number
              ).length;

              if (count !== s.ayah_count) {
                throw new Error(
                  `${label}: Surah ${s.surah_number} has ${count} verses`
                );
              }
            }
          }

          validate(arabic, 'Arabic');
          validate(urdu, 'Urdu');
          validate(english, 'English');

          const refSet = rows =>
            new Set(rows.map(r => `${r.surah_number}:${r.ayah_number}`));

          const arabicRefs = refSet(arabic);

          for (const [label, rows] of [
            ['Urdu', urdu],
            ['English', english]
          ]) {
            const otherRefs = refSet(rows);

            if (
              otherRefs.size !== arabicRefs.size ||
              [...arabicRefs].some(r => !otherRefs.has(r))
            ) {
              throw new Error(`${label} verse references do not match Arabic`);
            }
          }

          async function upsertBatches(table, rows, conflict) {
            for (let i = 0; i < rows.length; i += 200) {
              const { error } = await db
                .from(table)
                .upsert(rows.slice(i, i + 200), {
                  onConflict: conflict
                });

              if (error) {
                throw new Error(`${table}: ${error.message}`);
              }

              console.log(`${table}: ${Math.min(i + 200, rows.length)}/${rows.length}`);
            }
          }

          await upsertBatches(
            'quran_surahs',
            surahs,
            'surah_number'
          );

          const editions = [
            {
              edition_slug: 'ur-kanzul-iman',
              language_code: 'ur',
              title: 'Kanzul Iman',
              translator: 'Ahmed Raza Khan Barelvi',
              source_name: 'Repository translation file',
              source_reference: 'data/translations/ur.kanzuliman.txt',
              license_note: 'Confirm redistribution rights before public release.',
              is_enabled: true
            },
            {
              edition_slug: 'en-ahmed-raza',
              language_code: 'en',
              title: 'English Translation',
              translator: 'Ahmed Raza',
              source_name: 'Repository translation file',
              source_reference: 'data/translations/en.ahmedraza.txt',
              license_note: 'Confirm redistribution rights before public release.',
              is_enabled: true
            }
          ];

          const editionIds = {};

          for (const edition of editions) {
            const { data, error } = await db
              .from('quran_translation_editions')
              .upsert(edition, { onConflict: 'edition_slug' })
              .select('id, edition_slug')
              .single();

            if (error) {
              throw new Error(`Translation edition: ${error.message}`);
            }

            editionIds[data.edition_slug] = data.id;
          }

          await upsertBatches(
            'quran_ayahs',
            arabic.map(r => ({
              surah_number: r.surah_number,
              ayah_number: r.ayah_number,
              arabic_text: r.text,
              search_text: r.text
            })),
            'surah_number,ayah_number'
          );

          for (const [rows, slug] of [
            [urdu, 'ur-kanzul-iman'],
            [english, 'en-ahmed-raza']
          ]) {
            await upsertBatches(
              'quran_translations',
              rows.map(r => ({
                surah_number: r.surah_number,
                ayah_number: r.ayah_number,
                edition_id: editionIds[slug],
                translation_text: r.text,
                search_text: r.text
              })),
              'surah_number,ayah_number,edition_id'
            );
          }

          console.log('SUCCESS: Surahs, Arabic, Urdu and English data imported.');
          NODE
