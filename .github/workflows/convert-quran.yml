name: Convert Quran Text

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Convert Quran text
        run: node scripts/convert-quran.js

      - name: Commit generated ayahs.ts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quran/ayahs.ts
          git diff --cached --quiet || git commit -m "Generate Quran ayahs data"
          git push
